<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        /* accent color is per-extension, everything else is shared */
        :root{
            --accent:#1c4d8f;
            --bg:#ffffff;
            --fg:#1b1b1f;
            --muted:#6b7280;
            --line:#e5e7eb;
            --field:#ffffff;
        }

        @media (prefers-color-scheme: dark){
            :root{
                --bg:#1f2023;
                --fg:#e8e8ea;
                --muted:#9aa0a6;
                --line:#3a3b3f;
                --field:#2a2b2f;
            }
        }

        *{box-sizing:border-box}

        body{
            width:300px;
            margin:0;
            padding:14px;
            background:var(--bg);
            color:var(--fg);
            font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
        }

        h1{
            display:flex;
            align-items:center;
            gap:8px;
            margin:0 0 14px;
            font-size:13.5px;
            font-weight:600;
        }

        h1::before{
            content:"";
            width:8px;
            height:8px;
            border-radius:50%;
            background:var(--accent);
            flex:none;
        }

        section{margin-bottom:14px}

        .head{
            display:flex;
            justify-content:space-between;
            align-items:baseline;
            gap:8px;
            margin-bottom:6px;
        }

        .head strong{font-size:12px;font-weight:600}

        .links a{
            color:var(--accent);
            font-size:11px;
            cursor:pointer;
            text-decoration:none;
        }

        .links a:hover{text-decoration:underline}
        .links i{color:var(--muted);font-style:normal;margin:0 3px}

        .options{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:5px 10px;
            padding:8px;
            border:1px solid var(--line);
            border-radius:8px;
            background:var(--field);
            max-height:190px;
            overflow-y:auto;
        }

        .options label{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:12px;
            cursor:pointer;
        }

        input[type=checkbox]{
            width:14px;
            height:14px;
            margin:0;
            flex:none;
            accent-color:var(--accent);
        }

        .num{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:12px;
            color:var(--muted);
        }

        .num input{
            width:76px;
            padding:4px 6px;
            border:1px solid var(--line);
            border-radius:6px;
            background:var(--field);
            color:var(--fg);
            font:inherit;
        }

        .num input:focus{outline:2px solid var(--accent);outline-offset:-1px}

        .hint{margin:6px 0 0;font-size:11px;color:var(--muted)}

        #crawl{
            width:100%;
            padding:10px;
            border:0;
            border-radius:8px;
            background:var(--accent);
            color:#fff;
            font:600 13px/1 inherit;
            cursor:pointer;
        }

        #crawl:hover{filter:brightness(1.08)}
        #crawl:disabled{opacity:.6;cursor:default}

        #status{
            margin-top:10px;
            min-height:1.2em;
            font-size:11.5px;
            color:var(--muted);
            word-break:break-word;
        }
        </style>
</head>

<body>

<h1>MyCareersFuture</h1>

<section>
    <div class="head">
        <strong>Employment type</strong>
        <span class="links"><a id="empAll">all</a><i>&middot;</i><a id="empNone">none</a></span>
    </div>
    <div class="options" id="employmentTypes"></div>
    <p class="hint" id="empHint"></p>
</section>

<section>
    <div class="head">
        <strong>Pages</strong>
        <label class="num">max <input type="number" id="maxPages" min="1" step="1" placeholder="all"></label>
    </div>
    <p class="hint">Blank = every page of the search.</p>
</section>

<section>
    <div class="head">
        <strong>Speed</strong>
        <label class="num">parallel <input type="number" id="concurrency" min="1" max="12" step="1" value="6"></label>
    </div>
    <p class="hint">Requests running at the same time while reading company details.
    Drop to 2-3 if you see 429 errors.</p>
</section>

<button id="crawl">Crawl Search Results</button>

<div id="status"></div>

<!-- xlsx.full.min.js is not loaded here: it gets injected into the tab by popup.js -->
<script src="popup.js"></script>

</body>

</html>
